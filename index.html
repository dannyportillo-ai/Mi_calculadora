<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="calculadora">
        <h1>Mi Calculadora</h1>

        <input type="number" id="numero1" placeholder="Primer numero">

        <input type="number" id="numero2" placeholder="Segundo Numero">

        <section class="operaciones">
            <button id="sumar">+</button>
            <button id="restar">-</button>
            <button id="multiplicar">*</button>
            <button id="dividir">/</button>
        </section>

        <h2>Resultado:</h2>
        <p id="resultado">0</p>
    </main>


    <script src="script.js"></script>
</body>
</html>
